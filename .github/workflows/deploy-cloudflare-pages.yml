name: Deploy to Cloudflare Pages

# Replaces the Vercel integration that had been deploying this repo. The
# 2026-06-23 migration commit updated the docs to say "Cloudflare Pages" and
# deleted vercel.json, but never added a deploy workflow — so Vercel's GitHub
# App stayed the only thing that actually deployed, and its build is still
# published at jtam-website.vercel.app. This makes Cloudflare the system of
# record; the Vercel project should then be deleted (see README).

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: Production
      url: https://www.jtamb.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Verify deployment secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN to the Production environment secrets."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # `npm run build` is `tsc --noEmit && vite-react-ssg build`, so the
      # typecheck runs here rather than as a separate step.
      - name: Build production site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.120.0"
          command: pages deploy dist --project-name=jtam-website --branch=main
